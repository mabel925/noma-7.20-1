<!DOCTYPE html>
<html lang="en" style="background:#E9E6E1">
  <head>
    <meta charset="UTF-8" />
    <style>html, body { background:#E9E6E1; }</style>
    <link rel="preload" href="/apple-touch-icon.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/noma-app-icon-192.png" />
    <link rel="shortcut icon" type="image/png" href="/icons/noma-app-icon-192.png" />
    <link rel="image_src" href="/icons/noma-app-icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Noma">
    <meta name="application-name" content="Noma">
    <meta name="theme-color" content="#E9E6E1">
    <meta name="color-scheme" content="light">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Noma">
    <meta property="og:description" content="AI Smart Storage">
    <meta property="og:image" content="/icons/noma-app-icon-512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <title>Noma</title>
    <link rel="preload" href="/startup.jpg" as="image" type="image/jpeg" fetchpriority="high">
    <link rel="apple-touch-startup-image" href="/startup.jpg">
    <link rel="preload" href="/font/Alkatra-SemiBold.ttf" as="font" type="font/ttf" crossorigin="anonymous">
    <link rel="preload" href="/home-bg.jpg" as="image" type="image/jpeg">
    <link rel="preload" href="/home-logo.png" as="image" type="image/png">
    <link rel="preload" href="/default-avatar.jpg" as="image" type="image/jpeg">
    <link rel="preload" href="/noma-fallback.png" as="image" type="image/png">
    <link rel="preload" href="/pag/noma.pag" as="fetch" type="application/octet-stream" crossorigin="anonymous">
    <link rel="preload" href="/pag/libpag.wasm" as="fetch" type="application/wasm" crossorigin="anonymous">
    <link rel="manifest" href="/manifest.json">
    <style>
      html, body, #root, .pwa-shell, .iframe-wrap, .home-container {
        margin: 0 !important;
        padding: 0 !important;
        width: 100vw !important;
        height: var(--app-height, 100dvh) !important;
        background-color: #E9E6E1;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        width: 100vw;
        overflow: hidden;
        background-color: #E9E6E1;
        opacity: 1;
        transition: opacity 350ms ease-out;
      }
      #startup-splash-image {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        width: 100%;
        height: auto;
        max-width: none;
        pointer-events: none;
        user-select: none;
        transform: translateZ(0);
        backface-visibility: hidden;
      }
      #startup-splash.is-hidden { opacity: 0; pointer-events: none; }
      .startup-progress {
        position: absolute;
        left: 50%;
        bottom: max(42px, calc(env(safe-area-inset-bottom, 0px) + 18px));
        z-index: 1;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        opacity: 0;
        transition: opacity 120ms linear;
        contain: layout paint;
        backface-visibility: hidden;
      }
      #startup-splash.is-image-ready .startup-progress { opacity: 1; }
      .startup-progress-track {
        width: 126px;
        height: 6px;
        overflow: hidden;
        border-radius: 3px;
        background: #FFFFFF;
      }
      #startup-progress-fill {
        display: block;
        width: 4%;
        height: 100%;
        border-radius: inherit;
        background: #232121;
        transition: width 180ms ease-out;
      }
      #startup-progress-label {
        margin-top: 14px;
        color: rgba(35, 33, 33, 0.5);
        font: 400 14px/1.2 system-ui, sans-serif;
      }
    </style>
  </head>
  <body style="background:#E9E6E1">
    <div id="startup-splash" role="status" aria-label="Loading Noma">
      <img id="startup-splash-image" src="/startup.jpg" width="1170" height="2532" alt="" loading="eager" fetchpriority="high" decoding="sync" draggable="false" />
      <div class="startup-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4">
        <div class="startup-progress-track"><span id="startup-progress-fill"></span></div>
        <span id="startup-progress-label">4%</span>
      </div>
    </div>
    <script>
      (() => {
        const splash = document.getElementById('startup-splash');
        const image = document.getElementById('startup-splash-image');
        const revealProgress = () => requestAnimationFrame(() => splash?.classList.add('is-image-ready'));
        const revealAfterDecode = () => {
          if (typeof image?.decode !== 'function') {
            revealProgress();
            return;
          }
          image.decode().catch(() => undefined).finally(revealProgress);
        };
        if (image?.complete && image.naturalWidth > 0) revealAfterDecode();
        else {
          image?.addEventListener('load', revealAfterDecode, { once: true });
          image?.addEventListener('error', revealProgress, { once: true });
        }
      })();
    </script>
    <!-- 页面根容器，让背景色/图片和应用布局自适应自撑满整个视口 -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
