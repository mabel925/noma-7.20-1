<!doctype html>
<html lang="en">
  <body style="margin:0;background:#E9E6E1;font-family:Arial,sans-serif;color:#232121;">
    <div style="max-width:420px;margin:0 auto;padding:48px 24px;text-align:center;">
      <h1 style="margin:0 0 12px;font-size:28px;">Your Noma verification code</h1>
      <p style="margin:0 0 28px;color:rgba(35,33,33,.6);font-size:14px;line-height:1.6;">
        Enter this 6-digit code in Noma to continue.
      </p>
      <div style="display:inline-block;padding:16px 24px;border-radius:16px;background:#FFFFFF;font-size:32px;font-weight:700;letter-spacing:8px;">
        {{ .Token }}
      </div>
      <p style="margin:28px 0 0;color:rgba(35,33,33,.45);font-size:12px;line-height:1.6;">
        If you did not request this code, you can ignore this email.
      </p>
    </div>
  </body>
</html>
